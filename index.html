<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>77Feet Training</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--muted:#aab5ca;--line:#2a3650;--accent:#b9f34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:16px/1.5 system-ui}header{padding:22px 16px;background:#111827;border-bottom:1px solid var(--line)}h1{margin:0;font-size:26px}header p{margin:4px 0;color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;padding:12px;max-width:850px;margin:auto}button{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap}button.active{background:var(--accent);color:#111}main{max-width:850px;margin:auto;padding:12px}input{width:100%;padding:12px;background:#0e1628;color:white;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}section{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}h2{margin:5px 0 12px}h3{color:var(--accent);margin:0 0 8px}ul{padding-left:22px}li{margin:5px 0}.weight{display:inline-block;background:#26344c;border:1px solid #40516e;border-radius:7px;padding:3px 8px;font-weight:750}.note{background:#10182a;border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px;margin-top:10px}.muted,footer{color:var(--muted);font-size:13px}footer{text-align:center;padding:20px}</style></head><body><header><h1>77Feet Training</h1><p>Semana de entrenamiento · ejercicios, indicaciones y cargas calculadas desde tus RM</p></header><nav id="days"></nav><main><input id="search" placeholder="Buscar ejercicio, bloque o indicación…"><div id="content"></div></main><footer>Si no ves los cambios después de publicar, cierra la app y vuelve a abrirla para cargar la nueva versión.</footer>
<script>
const rm={ss:110,bs:190,bench:140,sc:150,sj:150,dl:240,fs:160};
const pct=(k,p)=>{let n=rm[k]*p/100;return Number.isInteger(n)?n:String(Number(n.toFixed(4)))};
const kg=(k,p)=>pct(k,p)+' kg ('+p+'%)';
const days=[
{n:'Lunes',b:[
['A.1 · Calentamiento',['3 rondas: 60″ Echo Bike progresiva; 3 Squat Snatch al 60%; 2 al 65%; 1 al 70%.','Descanso 2′ entre rondas.'],[kg('ss',60),kg('ss',65),kg('ss',70)],'Calienta y activa para las ladders. En la Echo Bike aumenta progresivamente sin fatigarte demasiado; busca una ligera quemazón en las piernas. Mueve la barra rápido, priorizando eficiencia y calidad.'],
['A.2 · Squat Snatch ladder',['1 serie 3/2/1 al 75/80/85%; descanso 3′.','1 serie 2/1/1 al 85/88/90%; descanso 3′.','1 serie 1/1/1 al 88/90/93%.'],[kg('ss',75),kg('ss',80),kg('ss',85),kg('ss',88),kg('ss',90),kg('ss',93)],'Últimas semanas de ladder: menos volumen y más carga. Con porcentajes altos, asegura las repeticiones.'],
['B · Back Squat',['5 × 3 Back Squat al 87,5%; descanso 2′.'],[kg('bs',87.5)],''],
['C · Metcon For Time · TC 12′',['50-30-10 Wall Balls','50-30-10 Chest to Bar','50-30-10 Box Jump Over (24/20″)'],[],'Controla el ritmo de salida: la primera ronda es una trampa. Si acabas los 50 con energía, aumenta el ritmo. Llega a los 30 con margen para apretar.']]},
{n:'Martes',b:[
['A · Gimnásticos For Time',['30-25-20-15-10-5 GHD Sit-ups','15-12-9-6-3-1 Ring Muscle-ups','Descanso 60″ entre rondas.'],[],''],
['B · Bench Press',['5 × 3 Bench Press al 87,5%; descanso 2′.'],[kg('bench',87.5)],''],
['C · Intervalos competitivos',['5 rondas de AMRAP 2′: 5 Wall Walks, 10 Alt. DB Snatch (40/25 kg), máximos Heavy Double Unders.','Descanso 30″ entre rondas.'],[],'No mires el reloj durante trabajo ni descanso; usa un pitido o compañero. Intenta mantener tiempos parecidos en Wall Walks y DB Snatch y un número similar de Double Unders.']]},
{n:'Miércoles',b:[
['A · Gimnásticos EMOM 10′',['Minutos impares: 2 Legless.','Minutos pares: 7,5 m + 7,5 m Handstand Walk con pirueta.'],[],'Prioriza eficiencia y escala si hace falta. No debe ser un EMOM fatigante.'],
['B.1 · Calentamiento halterofilia',['Cada 75″ × 4 sets.','Set 1: 1 Squat Clean + 1 Jerk Dip + 1 Split Jerk.','Set 2: 1 Clean Pull + 1 Hang Squat Clean + 1 Split Jerk.','2 sets al 60% y 2 al 70%.'],[],'Calentamiento técnico: muévete bien, sin prisa y prioriza la técnica.'],
['B.2 · Squat Clean + Split Jerk',['EMOM 3′: 1 Squat Clean + 1 Split Jerk al 75%.','EMOM 3′: 1 Squat Clean + 1 Split Jerk al 80%.','Descansa 2′.','A los 8:00, primer intento de máximo peso; a los 10:00, segundo; a los 12:00, tercero.'],[kg('sc',75)+' Squat Clean; '+kg('sj',75)+' Split Jerk',kg('sc',80)+' Squat Clean; '+kg('sj',80)+' Split Jerk'],'Los EMOM son calentamiento. Busca el single más pesado posible en 3 intentos. Un intento por ventana; no repitas si fallas.'],
['C · Deadlift',['5 × 1 Deadlift singles al 90%.'],[kg('dl',90)],''],
['D · Metcon',['4 rondas: 500/450 m Row, 9 Deadlift (140/100 kg), 15 Against the Wall Strict Handstand Push-ups.'],[],'Busca rondas idénticas. Controla el remo y gestiona deadlifts pesados y HSPU estrictos. Vigila especialmente la tercera ronda.']]},
{n:'Jueves',b:[
['A · Running Sesh',['20′ de calentamiento.','Por tiempo: 150 m, 300 m, 500 m, 500 m, 300 m, 150 m.','Descanso 2′ entre series.','Termina con 5′ suaves.'],[],'Sesión en pista: ritmo alto.'],
['Calentamiento sugerido de 20′',['5′ trote suave.','5′ movilidad dinámica: tobillos, balanceos de piernas, zancadas y elevaciones de gemelos.','5′ técnica: skipping bajo/alto y talones al glúteo.','5′ con 3 progresivos de 60 m al 60–70%, 75–80% y 85–90%.'],[],'El calentamiento debe prepararte, no fatigarte.']]},
{n:'Viernes',b:[
['A · Accesorios EMOM 12′',['Minuto 1: 5 Strict Toes to Bar + 15″ Hang Tuck Hold.','Minuto 2: 20″ + 20″ Copenhagen Plank.','Minuto 3: 5+5 DB Goblet Step Down, bajada controlada y cajón bajo.'],[],''],
['B · Front Squat',['4 × 3 Front Squat al 87,5%.'],[kg('fs',87.5)],''],
['C · Squat Efficiency',['Cada 2′ × 4 rondas alternando.','Impares: 20 m Heavy Sled Push + 10 Dual KB Front Squat (24/16 kg).','Pares: 20 m Heavy Sled Drag + 10 Dual KB Front Squat.','Máximo 75″ de trabajo por intervalo.'],[],'Trineo pesado, pero manejable para completar los segmentos seguidos.'],
['D · Metcon AMRAP 12′',['Máximas Rope Climbs.','Cada 3′ desde 0:00: 3 rondas de 8 Thrusters (43/30 kg) + 8/7 calorías Ski.','Repite la secuencia 4 veces: primero Thrusters/Ski y luego Rope Climbs durante el tiempo restante.'],[],'Objetivo: mismo número de subidas por ventana y tiempos similares para las 3 rondas de Thrusters/Ski.']]},
{n:'Sábado',b:[
['77 Feet Madness · Simulación competición',['Realiza las tres piezas seguidas, descansando todo lo posible entre A, B y C. Hidrátate y toma carbohidratos entre piezas.'],[],'Estímulo competitivo de final de temporada.'],
['A · Weightlifting Metcon (1) · For Time',['Antes de 8′: 20/15 cal Echo Bike, 12 Burpee Box Jump Over (24/20″), 9 Power Snatch (60/40 kg); 20/15 Echo, 12 BBJO, 7 Power Snatch (70/45 kg).','Si acabas antes de 8′, añade 4′: 20/15 Echo, 12 BBJO, 5 Power Snatch (80/53 kg).','Si acabas antes de 12′, añade 4′: 20/15 Echo, 12 BBJO, 3 Power Snatch (90/60 kg).','Si acabas antes de 16′, añade 4′: 20/15 Echo, 12 BBJO, 1 Power Snatch (100/65 kg).'],[],'Los pesos son los prescritos por el programa (hombres/mujeres), no porcentajes de tu RM. Descansa, hidrátate y toma carbohidratos.'],
['B · Skills Metcon (2)',['1-1-1 ramp up; 3-2-1 Bar Complex; 1-1-1 ramp back; 3-2-1 Bar Complex.','Bar Complex = 4 Toes to Bar + 2 Bar Muscle-ups.'],[],'Descansa todo lo posible antes de C, hidrátate y toma carbohidratos.'],
['C · Metcon mixto · 4 rondas',['400 m Run.','Sandbag Clean: 12-9-6-3 repeticiones (70/45 kg).','30 m Sandbag Bearhug Carry en bloques de 10 m.'],[],'']]},
{n:'Domingo',b:[['Rest Day',['Descanso y recuperación.'],[],'']]}
];
const nav=document.getElementById('days'),content=document.getElementById('content'),search=document.getElementById('search');let active=0;
function render(){nav.innerHTML='';days.forEach((d,i)=>{let x=document.createElement('button');x.textContent=d.n;x.className=i===active?'active':'';x.onclick=()=>{active=i;render()};nav.appendChild(x)});let d=days[active],q=search.value.toLowerCase(),out='<h2>'+d.n+'</h2>';d.b.forEach(b=>{if(q&&!b.join(' ').toLowerCase().includes(q))return;out+='<section><h3>'+b[0]+'</h3><ul>'+b[1].map(t=>'<li>'+t+'</li>').join('')+'</ul>';if(b[2].length)out+='<p><b>Cargas calculadas desde tus RM</b></p><ul>'+b[2].map(t=>'<li><span class="weight">'+t+'</span></li>').join('')+'</ul>';if(b[3])out+='<div class="note">'+b[3]+'</div>';out+='</section>'});content.innerHTML=out}
search.addEventListener('input',render);render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
